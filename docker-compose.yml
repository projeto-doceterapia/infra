# Base stack for the Doceterapia system. Pulls prebuilt, pinned GHCR images
# only; it never builds. Copy .env.example to .env and fill it before use.
# Every variable is passed explicitly per service (no shared env_file) and is
# required (${VAR:?message}) so a missing value stops compose with its name.
# Exceptions use ${VAR:-default}: optional settings with a safe default
# (DISCOVER_GROUPS, ACCEPT_OWN_MESSAGES, COOKIE_SECURE, SWAGGER_ENABLED,
# DEMO_DATA) and the bootstrap credentials (ADMIN_EMAIL, ADMIN_SENHA), which are
# removed from .env after the first start. CORS_ALLOWED_ORIGINS uses
# ${VAR?message}: the line must exist, but empty is valid because the web app
# reaches the API on its own origin through /api.
#
# Networks: `interna` is Docker-internal (internal: true) and holds the
# database, back-end and redis, so none is reachable from the host nor the
# internet; `publica` is a normal bridge that carries only host-facing
# traffic; `saida` is an egress-only bridge for the assistant services that
# need the internet. The front-end sits on `interna` + `publica` (publishes
# its port and proxies to the back-end). orquestrador, adaptador-baileys and
# ngrok sit on `interna` + `saida` (in-stack traffic plus outbound internet).

name: doceterapia

services:
  banco-de-dados:
    image: ghcr.io/projeto-doceterapia/banco-de-dados:${BANCO_DE_DADOS_TAG:?set BANCO_DE_DADOS_TAG in .env}
    restart: unless-stopped
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - banco-de-dados-data:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
      start_interval: 2s

  back-end:
    image: ghcr.io/projeto-doceterapia/back-end:${BACK_END_TAG:?set BACK_END_TAG in .env}
    restart: unless-stopped
    # The image sets the JVM heap to 75% of this limit (MaxRAMPercentage).
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?set SPRING_PROFILES_ACTIVE in .env}
      DB_URL: ${DB_URL:?set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ORQUESTRADOR_TOKEN: ${ORQUESTRADOR_TOKEN:?set ORQUESTRADOR_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS?set CORS_ALLOWED_ORIGINS in .env (may be empty)}
      # Bootstrap credentials: read only while the user table is empty and
      # removed from .env after the first sign-in, so they must stay optional.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DEMO_DATA: ${DEMO_DATA:-false}
    networks:
      - interna
    depends_on:
      banco-de-dados:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough for the migrations and the demonstration data on a new
      # database. start_interval reports healthy as soon as it is ready.
      start_period: 120s
      start_interval: 2s

  front-end:
    image: ghcr.io/projeto-doceterapia/front-end:${FRONT_END_TAG:?set FRONT_END_TAG in .env}
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    environment:
      API_UPSTREAM: ${API_UPSTREAM:?set API_UPSTREAM in .env}
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:?set API_UPSTREAM_HOST in .env}
    ports:
      # Only the web app is published to the host. Container listens on 8080
      # (unprivileged nginx). Override FRONTEND_HOST_PORT only for local tests.
      - "${FRONTEND_HOST_PORT:-3000}:8080"
    networks:
      # Publishes its port on `publica` and proxies /api to the back-end over
      # the isolated `interna` network.
      - publica
      - interna
    depends_on:
      # nginx resolves the back-end per request, so the web app can come up
      # first and serve the shell while the API finishes starting.
      back-end:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 2s

  redis:
    image: redis:${REDIS_TAG:?set REDIS_TAG in .env}
    restart: unless-stopped
    mem_limit: 128m
    # AOF persistence (everysec), no key eviction, password-protected. maxmemory
    # stays below mem_limit so writes fail with an error before the kernel kills
    # the container.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 2s

  # --- Assistant services --------------------------------------------------
  # orquestrador is a base service (always up). adaptador-baileys joins only on
  # the `baileys` profile (below). Both sit on `interna` for in-stack traffic
  # (redis, back-end, each other) and on `saida` for the outbound internet
  # calls they need; in Cloud API mode the inbound webhook is exposed through
  # the `tunnel` profile (ngrok, below), so no host port is published here.
  orquestrador:
    image: ghcr.io/projeto-doceterapia/orquestrador:${ORQUESTRADOR_TAG:?set ORQUESTRADOR_TAG in .env}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      CHANNEL: ${CHANNEL:?set CHANNEL in .env}
      BENEFICIARIA_TELEFONE: ${BENEFICIARIA_TELEFONE:?set BENEFICIARIA_TELEFONE in .env}
      # Reaches the core on the internal network.
      CORE_BASE_URL: ${CORE_BASE_URL:?set CORE_BASE_URL in .env}
      # Service credential for the back-end routes the assistant calls.
      ORQUESTRADOR_TOKEN: ${ORQUESTRADOR_TOKEN:?set ORQUESTRADOR_TOKEN in .env}
      REDIS_URL: ${ORQUESTRADOR_REDIS_URL:?set ORQUESTRADOR_REDIS_URL in .env}
      CONV_TTL_MIN: ${CONV_TTL_MIN:?set CONV_TTL_MIN in .env}
      MAX_AJUSTES: ${MAX_AJUSTES:?set MAX_AJUSTES in .env}
      RETRY_MAX_TENTATIVAS: ${RETRY_MAX_TENTATIVAS:?set RETRY_MAX_TENTATIVAS in .env}
      RETRY_BASE_S: ${RETRY_BASE_S:?set RETRY_BASE_S in .env}
      RETRY_CAP_S: ${RETRY_CAP_S:?set RETRY_CAP_S in .env}
      TZ: ${TZ:?set TZ in .env}
      # Baileys channel: the adapter base URL and the shared/HMAC secrets.
      ADAPTER_URL: ${ADAPTER_URL:?set ADAPTER_URL in .env}
      ADAPTER_SECRET: ${ADAPTER_SECRET:?set ADAPTER_SECRET in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      # Cloud API channel (used only when CHANNEL=cloud_api).
      CLOUD_API_PHONE_ID: ${CLOUD_API_PHONE_ID:?set CLOUD_API_PHONE_ID in .env}
      CLOUD_API_TOKEN: ${CLOUD_API_TOKEN:?set CLOUD_API_TOKEN in .env}
      CLOUD_API_APP_SECRET: ${CLOUD_API_APP_SECRET:?set CLOUD_API_APP_SECRET in .env}
      CLOUD_API_VERIFY_TOKEN: ${CLOUD_API_VERIFY_TOKEN:?set CLOUD_API_VERIFY_TOKEN in .env}
      CLOUD_API_GRAPH_VERSION: ${CLOUD_API_GRAPH_VERSION:?set CLOUD_API_GRAPH_VERSION in .env}
      # LLM provider (purchase extraction).
      LLM_PROVIDER: ${LLM_PROVIDER:?set LLM_PROVIDER in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:?set GEMINI_MODEL in .env}
    networks:
      # Reaches redis and the back-end on `interna`; needs `saida` for outbound
      # calls to the LLM provider and the Meta Graph API (Cloud API mode).
      - interna
      - saida
    depends_on:
      redis:
        condition: service_healthy
      back-end:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # HTTPS tunnel to the orchestrator webhook (Cloud API channel). Starts only
  # with `--profile tunnel`, on the account's fixed ngrok domain, which survives
  # restarts so the webhook registered at Meta stays valid.
  ngrok:
    image: ngrok/ngrok:${NGROK_TAG:?set NGROK_TAG in .env}
    profiles:
      - tunnel
    restart: unless-stopped
    mem_limit: 64m
    command:
      - http
      - --url=${NGROK_DOMAIN:?set NGROK_DOMAIN in .env}
      - ${NGROK_UPSTREAM:-orquestrador:8000}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    # ngrok's local inspection UI (unauthenticated; it shows request bodies).
    # Bound to loopback by default; see NGROK_WEB_BIND in .env.example.
    ports:
      - "${NGROK_WEB_BIND:-127.0.0.1}:${NGROK_WEB_PORT:-4040}:4040"
    networks:
      # Dials out to the ngrok service over `saida` and forwards inbound
      # requests to the orchestrator over the isolated `interna` network.
      - saida
      - interna
    depends_on:
      orquestrador:
        condition: service_healthy
    healthcheck:
      # The agent API lists the endpoint only once it is online on the domain.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4040/api/tunnels | grep -q public_url"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s

  # Baileys adapter: starts only with `--profile baileys`. Cloud API mode runs
  # without it. Keeps the WhatsApp session in a named volume and forwards
  # inbound events to the orchestrator webhook over the internal network.
  adaptador-baileys:
    image: ghcr.io/projeto-doceterapia/adaptador-baileys:${ADAPTADOR_BAILEYS_TAG:?set ADAPTADOR_BAILEYS_TAG in .env}
    profiles:
      - baileys
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GRUPO_JID: ${GRUPO_JID:?set GRUPO_JID in .env}
      ADAPTER_SECRET: ${ADAPTER_SECRET:?set ADAPTER_SECRET in .env}
      # Orchestrator webhook the adapter posts inbound events to. The
      # orchestrator exposes the inbound route at /webhook on port 8000
      # (see .env.example and README).
      WEBHOOK_URL: ${WEBHOOK_URL:?set WEBHOOK_URL in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      SESSION_DIR: ${BAILEYS_SESSION_DIR:?set BAILEYS_SESSION_DIR in .env}
      LOG_LEVEL: ${BAILEYS_LOG_LEVEL:?set BAILEYS_LOG_LEVEL in .env}
      # Opt-in group discovery; defaults to false so existing .env files
      # without the variable keep working.
      DISCOVER_GROUPS: ${DISCOVER_GROUPS:-false}
      # Single-number mode: treats messages sent by the paired account itself
      # as inbound. Off by default, so only the fallback setup turns it on.
      ACCEPT_OWN_MESSAGES: ${ACCEPT_OWN_MESSAGES:-false}
    volumes:
      - adaptador-baileys-session:/data/session
    networks:
      # Reaches the orchestrator on `interna`; needs `saida` for the outbound
      # WhatsApp connection.
      - interna
      - saida
    depends_on:
      orquestrador:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  banco-de-dados-data:
  redis-data:
  adaptador-baileys-session:

networks:
  # Isolated back-plane: no gateway, so its members (the database, back-end,
  # redis and the assistant services) have no inbound or outbound host/internet
  # reachability. Containers here cannot publish ports.
  interna:
    driver: bridge
    internal: true
  # Host/internet-facing bridge. Only services that must be reached from the
  # host (or forward traffic in) attach here; currently just the front-end,
  # which publishes its port.
  publica:
    driver: bridge
  # Egress-only bridge: gives the assistant services (orquestrador, ngrok,
  # adaptador-baileys) outbound internet access without publishing any port,
  # while they stay on `interna` for in-stack traffic.
  saida:
    driver: bridge
