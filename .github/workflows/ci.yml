name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-config:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Provide .env from the example
        run: cp .env.example .env

      - name: Validate base compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate base + local override
        run: docker compose -f docker-compose.yml -f compose.local.yml config --quiet

      - name: Validate base with every profile
        run: docker compose -f docker-compose.yml --profile tunnel --profile baileys config --quiet

      - name: Validate base + local override with the tunnel profile
        run: docker compose -f docker-compose.yml -f compose.local.yml --profile tunnel config --quiet

      - name: Reject unpinned images and missing memory limits
        run: |
          cfg=$(docker compose -f docker-compose.yml --profile tunnel --profile baileys config --format json)
          echo "$cfg" | jq -e '[.services | to_entries[] | select(.value.image | test(":latest$|^[^:]+$")) | .key] | if length == 0 then true else error("unpinned image: \(.)") end'
          echo "$cfg" | jq -e '[.services | to_entries[] | select(.value.mem_limit == null) | .key] | if length == 0 then true else error("missing mem_limit: \(.)") end'

  launcher-tests:
    name: Launcher tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pester 3.4.0 ships with Windows PowerShell 5.1, the launcher's runtime.
      - name: Run Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Path tests -EnableExit
